<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>SupplyMatch — совместные закупки и доставка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Светлая тема, крупный шрифт и большие кнопки — удобно пожилым людям */
:root{--bg:#ffffff;--soft:#f4f6f1;--ink:#111a13;--mute:#3f4a42;--line:#d5dccf;--brand:#17692f;--brand-2:#e5f2e8;--acc:#c2410c;--acc-2:#fff0e6;--gold:#a86f00;--bad:#b42318;--bad-2:#fdecea;--wa:#128c4a;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px;-webkit-tap-highlight-color:rgba(23,105,47,.15)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Inter,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(32px,5.4vw,50px);font-weight:800}
h2{font-size:clamp(26px,3.4vw,34px);font-weight:800;margin-bottom:18px}
h3{font-size:21px;font-weight:700}
p{margin:0}
:focus-visible{outline:4px solid #f59e0b;outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;clip:auto;z-index:60;background:#fff;padding:12px 18px;border-radius:12px;font-weight:700}

/* шапка */
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:72px}
.logo{font-weight:800;font-size:24px;text-decoration:none;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.logo span{color:var(--brand)}
nav.main{display:flex;gap:2px}
nav.main a{text-decoration:none;padding:10px 11px;border-radius:12px;color:var(--mute);font-weight:600;font-size:17px;white-space:nowrap}
nav.main a:hover{background:var(--soft);color:var(--ink)}
nav.main a.on{background:var(--brand-2);color:var(--brand)}
.hbtn{display:inline-flex;align-items:center;border:2px solid var(--line);background:#fff;border-radius:12px;min-height:48px;padding:8px 14px;font:700 16px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink);white-space:nowrap;text-decoration:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.hbtn.help{background:var(--acc);border-color:var(--acc);color:#fff}
.hbtn.acc.in{border-color:var(--brand);color:var(--brand)}
#menuBtn{display:none}

/* мобильное меню */
#menu{position:fixed;inset:0;background:#fff;z-index:30;padding:16px;overflow:auto;overscroll-behavior:contain;display:none}
#menu.open{display:block}
body:has(#menu.open){overflow:hidden}
#menu .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#menu a.mi{display:flex;align-items:center;gap:16px;text-decoration:none;font-size:22px;font-weight:700;padding:16px 18px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
#menu a.mi i{font-style:normal;font-size:28px}
#menu a.mi.on{border-color:var(--brand);background:var(--brand-2);color:var(--brand)}

main{padding-top:32px;padding-bottom:96px;min-height:60vh}
section{margin-top:56px}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;min-height:56px;padding:14px 24px;background:var(--brand);color:#fff;font:700 18px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center;touch-action:manipulation;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.orange{background:var(--acc)}
.btn.red{background:#fff;color:var(--bad);border:2px solid #f3b4ae}
.btn.big{min-height:72px;font-size:21px;padding:18px 28px;border-radius:18px}
.btn.wide{width:100%}
.btn.sm{min-height:48px;padding:10px 16px;font-size:16px;border-radius:12px}
.btn:disabled{background:#e9ede5;color:var(--mute);cursor:default;filter:none;border:0}
.link{background:none;border:0;padding:4px;color:var(--acc);font:700 18px Inter,system-ui,sans-serif;text-decoration:underline;cursor:pointer}
input,select{width:100%;font:inherit;font-size:19px;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;min-height:56px;padding:12px 14px;margin-top:8px}
input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
input[aria-invalid=true]{border-color:var(--bad)}
label{display:block;font-size:17px;color:var(--ink);font-weight:600}
.hint{display:block;font-weight:400;font-size:15px;color:var(--mute)}
.fgrid{display:grid;gap:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{display:none;background:var(--bad-2);color:var(--bad);border-radius:12px;padding:12px 16px;font-weight:600}
.err.show{display:block}

.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:26px}
.panel.soft{background:var(--soft);border-color:transparent}
.narrow{max-width:560px;margin:0 auto}
.meta{color:var(--mute);font-size:17px}
.lead{color:var(--mute);font-size:20px;max-width:620px;margin-top:14px}
.eyebrow{display:inline-block;background:var(--brand-2);color:var(--brand);font-weight:700;font-size:16px;padding:6px 14px;border-radius:99px;margin-bottom:18px}
.tag{display:inline-block;background:var(--brand-2);color:var(--brand);border-radius:8px;padding:3px 10px;font-size:15px;font-weight:700;margin:4px 6px 0 0}
.save{background:var(--acc-2);color:var(--acc);font-weight:800;font-size:16px;padding:3px 10px;border-radius:8px}
.badge{display:inline-block;border-radius:99px;padding:4px 12px;font-size:15px;font-weight:700;background:var(--soft);color:var(--mute)}
.badge.open{background:var(--brand-2);color:var(--brand)}
.badge.full,.badge.ready{background:#fff4d6;color:#7a5200}
.badge.shipped{background:#e3effd;color:#1d4f91}
.badge.done{background:var(--brand);color:#fff}
.badge.cancelled{background:var(--bad-2);color:var(--bad)}
.stars{color:var(--gold);font-weight:800;white-space:nowrap}
.head{margin-bottom:28px}
.empty{padding:32px;text-align:center;border:2px dashed var(--line);border-radius:18px;color:var(--mute)}
.note{font-size:16px;color:var(--mute);margin-top:12px}
.num{font-variant-numeric:tabular-nums}

/* главная */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center}
.cta{display:grid;gap:12px;margin-top:28px;max-width:520px}
.helpline{margin-top:14px;font-size:18px;color:var(--mute)}
.kpis{display:flex;gap:32px;margin-top:28px;flex-wrap:wrap}
.kpis b{display:block;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis span{font-size:16px;color:var(--mute)}
.flow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:24px;padding:28px 18px}
.node{flex:1;text-align:center}
.node span{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:42px}
.node b{display:block;font-size:19px}
.node small{display:block;font-size:15px;color:var(--mute)}
.arr{font-size:30px;color:var(--brand);font-weight:800;flex:none}
.flow-note{margin-top:14px;text-align:center;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step b{width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:16px}
.step p,.trust p{color:var(--mute);margin-top:10px}
.trust .ic{font-size:40px;line-height:1;margin-bottom:12px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.unit{display:flex;align-items:center;gap:10px}.unit span{margin-top:8px;font-weight:700;min-width:28px}
.res-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}
.res-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.res-big{background:var(--brand-2);border-radius:16px;padding:18px 20px;margin-top:12px}
.res-big b{display:block;font-size:36px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.faq details{border:2px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff}
.faq summary{cursor:pointer;padding:18px 20px;font-weight:700;font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;line-height:1;color:var(--brand)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 20px 18px;color:var(--mute)}

/* карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.pool{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.pool .pic{font-size:52px;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pool h3{font-size:25px}
.price b{font-size:28px;font-weight:800}
.price s{color:var(--mute);margin-left:8px;font-size:17px}
.prog{height:16px;background:#e3e8de;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transform-origin:left;transition:transform .4s}
.left{font-weight:700}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:99px;min-height:50px;padding:8px 18px;font:600 17px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.sbar{display:flex;gap:10px;margin-top:8px}
.sbar input{margin-top:0}
.sbar .btn{flex:none}
.ex{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ex button{background:#fff;border-radius:99px;padding:8px 14px;font:500 16px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink);border:2px solid var(--line)}
.match{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:#fff;border:2px solid var(--brand);border-radius:18px;padding:18px;margin-top:12px}
.score{font-size:30px;font-weight:800;color:var(--brand)}
.pcard{display:flex;gap:16px;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;cursor:pointer;font:inherit;color:inherit}
.pcard:hover{border-color:var(--brand)}
.av{flex:none;width:64px;height:64px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:34px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}

/* вход и регистрация */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:2px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.role b{display:block;font-size:20px}
.role span{display:block;color:var(--mute);font-size:16px;margin-top:4px}
.role[aria-pressed=true]{border-color:var(--brand);background:var(--brand-2)}
.demo{background:#fff8e6;border:2px dashed #e7c46a;border-radius:16px;padding:16px 18px;font-size:16px}

/* продать */
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;align-items:start}
.helpcard{background:var(--acc-2);border:2px solid #fed7aa;border-radius:20px;padding:26px}
.helpcard .btn{width:100%;margin-top:12px}
.phone{font-size:26px;font-weight:800;margin:14px 0 4px}

/* доставка */
.counter{display:flex;align-items:center;gap:10px;margin-top:8px}
.counter button{width:56px;height:56px;border-radius:14px;border:2px solid var(--line);background:#fff;font:800 26px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.counter output{min-width:56px;text-align:center;font-size:28px;font-weight:800}
.route{list-style:none;margin:14px 0 0;padding:0}
.route li{position:relative;padding:0 0 18px 34px}
.route li::before{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--brand)}
.route li::after{content:"";position:absolute;left:13px;top:24px;bottom:2px;width:3px;background:var(--line)}
.route li:last-child::after{display:none}
.route li:first-child::before{background:var(--acc)}
.list{margin:12px 0 0;padding-left:24px;display:grid;gap:8px}

/* кабинет */
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.card.cancelled{background:#fcfcfb;opacity:.8}
.stp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.stp span{padding:10px 6px;border-radius:10px;background:#eef1ea;font-size:15px;font-weight:600;text-align:center;color:var(--mute)}
.stp span.on{background:var(--brand);color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.rate button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:28px;cursor:pointer;color:var(--gold)}
.rate button:hover,.rate button:focus-visible{background:#fff4d6}
.buyers{margin:10px 0 0;padding:0;list-style:none}
.buyers li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:2px solid var(--soft);flex-wrap:wrap}

/* окно */
dialog{border:0;border-radius:22px;padding:26px;max-width:600px;width:calc(100% - 24px);max-height:calc(100% - 24px);background:#fff;color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:rgba(10,20,10,.5)}
.dlg-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.okdlg{text-align:center}
.okic{width:96px;height:96px;margin:4px auto 18px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:52px;font-weight:800}
.okic.info{background:var(--acc)}
.okdlg p{font-size:20px;color:var(--mute);margin:-6px 0 22px}
.rev{border-top:2px solid var(--line);padding:12px 0}

/* кнопка WhatsApp */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;background:var(--wa);color:#fff;border:0;border-radius:99px;min-height:64px;padding:12px 22px 12px 16px;font:700 18px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);touch-action:manipulation}
.fab span{font-size:30px;line-height:1}

footer{border-top:2px solid var(--line);padding:32px 0 110px;color:var(--mute);font-size:16px;background:var(--soft)}
.fgrid4{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
footer a{display:block;text-decoration:none;padding:4px 0;color:var(--ink);font-weight:600}
footer a:hover{text-decoration:underline}
footer b{display:block;color:var(--ink);margin-bottom:8px}

.banner{background:#fff4d6;border:2px solid #f0c75e;border-radius:14px;padding:12px 16px;margin-top:16px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:16px 24px;border-radius:14px;font-size:18px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

@media (max-width:1060px){
  nav.main{display:none}
  #menuBtn{display:inline-flex}
}
@media (max-width:760px){
  .hero,.calc,.two,.filters,.steps,.fgrid4,.roles{grid-template-columns:1fr}
  .hero{gap:32px}
  section{margin-top:44px}
  .panel{padding:20px}
  .sbar{flex-direction:column}
  .match{grid-template-columns:1fr}
  .logo{font-size:21px}
  .hbtn{padding:8px 10px;font-size:15px}
  .hbtn.help,.hbtn.lang{display:none}
  .stp span{font-size:13px;padding:8px 2px}
  .node span{width:64px;height:64px;font-size:32px}
  .node b{font-size:16px}.node small{font-size:13px}
  .arr{font-size:22px}
  .flow{padding:20px 10px}
  .fab{padding:12px;min-height:60px}
  .fab b{display:none}
}
@media (max-width:400px){.f2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="sr" href="#app">Перейти к содержимому</a>
<header class="top"><div class="wrap bar">
  <a class="logo" href="#home" translate="no" aria-label="SupplyMatch — на главную">Supply<span>Match</span></a>
  <nav class="main" id="nav" aria-label="Разделы"></nav>
  <button class="hbtn lang" id="lang" type="button"></button>
  <a class="hbtn acc" id="accBtn" href="#login"></a>
  <button class="hbtn help" type="button" data-help id="helpBtn"></button>
  <button class="hbtn" type="button" id="menuBtn" aria-controls="menu" aria-expanded="false"></button>
</div></header>
<div id="menu" role="dialog" aria-modal="true" aria-label="Меню"></div>
<div class="wrap" id="banner"></div>
<main class="wrap" id="app" tabindex="-1"></main>
<footer><div class="wrap" id="foot"></div></footer>
<button class="fab" type="button" data-help id="fab"><span aria-hidden="true">💬</span><b></b></button>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Подключение к базе Supabase =====
   Вставьте Project URL и anon public key (Supabase → Settings → API).
   Пусто — сайт работает в оффлайн-демо режиме: данные только в этом браузере.
   Открыть оффлайн-демо при заполненных ключах: добавьте к адресу ?offline */
const SUPABASE_URL="https://oumshloaaalpuwqmkjbc.supabase.co";
const SUPABASE_KEY="sb_publishable_WfXmM_bublqjSpmRQRUBMg_cs7yuDFD"; // публичный ключ, его можно хранить в коде
const EMAIL_DOMAIN="phone.supplymatch.example"; // служебный логин из номера телефона, письма не отправляются
const SUPABASE_JS="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";

/* ===== Демо-данные (условные, заменить данными из интервью) ===== */
const CAT={veg:{ru:"Овощи",kz:"Көкөніс",i:"🥔"},fruit:{ru:"Фрукты и бахча",kz:"Жеміс және бақша",i:"🍎"},dairy:{ru:"Молочное",kz:"Сүт өнімдері",i:"🥛"},meat:{ru:"Мясо",kz:"Ет",i:"🥩"},grain:{ru:"Крупы и мука",kz:"Жарма және ұн",i:"🌾"},honey:{ru:"Мёд и домашнее",kz:"Бал және үй өнімдері",i:"🍯"}};
const TYPE_IC={farm:"👨‍🌾",home:"👵",whole:"🏢"};
// расстояния до Тараза примерные
const DIST=[
 {id:"taraz",ru:"Тараз",kz:"Тараз",km:0},
 {id:"sarykemer",ru:"Байзакский р-н (Сарыкемер)",kz:"Байзақ ауданы (Сарыкемер)",km:15},
 {id:"asa",ru:"Жамбылский р-н (Аса)",kz:"Жамбыл ауданы (Аса)",km:25},
 {id:"zhualy",ru:"Жуалынский р-н",kz:"Жуалы ауданы",km:90},
 {id:"karatau",ru:"Таласский р-н (Каратау)",kz:"Талас ауданы (Қаратау)",km:110},
 {id:"merke",ru:"Меркенский р-н",kz:"Меркі ауданы",km:150},
 {id:"kulan",ru:"Р-н Т. Рыскулова (Кулан)",kz:"Т. Рысқұлов ауданы (Құлан)",km:190},
 {id:"shu",ru:"Шуский р-н",kz:"Шу ауданы",km:270}

const hash=s=>{let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return(x>>>0).toString(16)};

// стоимость участия: товар + доля общей машины + 5% услуги
function calc(p,qty){
  const km=dist(prod(p.prod).dist).km;
  const goods=qty*p.price,deliv=trip(km)*Math.ceil(p.target/CAP)*qty/p.target,comm=goods*COMM,total=goods+deliv+comm;
  const retail=p.retail?qty*p.retail:null;
  return{goods,retail,deliv,comm,total,saved:retail==null?null:retail-total};
}

// срок вышел, а партия не собрана → сбор отменяется, деньги возвращаются
function tick(){
  const now=Date.now();let ch=false;
  S.pools.forEach(p=>{if(p.status==="open"&&p.deadline<now){p.status="cancelled";poolOrders(p).forEach(o=>o.status="cancelled");ch=true}});
  if(ch)save();
}
function checkFull(p){
  if(p.status==="open"&&p.got>=p.target){p.status="full";poolOrders(p).forEach(o=>{if(o.status==="wait")o.status="ready"})}
}
function checkDone(p){
  const os=poolOrders(p);
  if(p.status==="shipped"&&os.every(o=>o.status==="done"))p.status="done";
}

/* ===== Хранилище: оффлайн-демо или общая база Supabase ===== */
// Оффлайн-демо: всё хранится в этом браузере. Работает без ключей и без интернета
const LocalAPI={
  async init(){S=store.get("sm_state3");if(!S||S.v!==3)S=fresh();me=store.get("sm_me")},
  tick,
  async login(ph,pin){const u=S.users.find(x=>x.phone===ph&&x.pin===pinHash(ph,pin));if(!u)return{err:"err_login"};setMe(u.id);return{user:u}},
  async register(d){
    if(S.users.some(x=>x.phone===d.phone))return{err:"err_phone_used"};
    const u={id:uid("u"),role:d.role,name:d.name,phone:d.phone,pin:pinHash(d.phone,d.pin)};
    if(d.role==="seller"){const p={id:uid("p"),name:d.name,type:d.type,dist:d.dist,cats:[],goods:"",desc:{ru:L.ru.new_desc,kz:L.kz.new_desc},rev:[],deals:0,owner:u.id};S.prods.push(p);u.prod=p.id}
    S.users.push(u);save();setMe(u.id);return{user:u};
  },
  async logout(){setMe(null)},
  async join(id,q){
    const p=pool(id),u=user();
    if(!u||u.role!=="shop")return{err:"only_shops"};
    if(!p||p.status!=="open")return{err:"closed"};
    if(mine(p))return{err:"own"};
    if(q<1||q>p.target-p.got)return{err:"err_kg"};
    let o=S.orders.find(x=>x.pool===p.id&&x.user===u.id&&x.status==="wait");
    if(o)o.qty+=q;else{o={id:uid("o"),pool:p.id,user:u.id,qty:q,status:"wait",rev:0};S.orders.unshift(o)}
    const c=calc(p,o.qty);o.total=c.total;o.saved=c.saved;
    p.got+=q;checkFull(p);save();return{data:p.status};
  },
  async cancelOrder(id){const o=S.orders.find(x=>x.id===id&&x.user===me);if(!o||o.status!=="wait")return{err:"state"};const p=pool(o.pool);p.got=Math.max(0,p.got-o.qty);o.status="cancelled";save();return{}},
  async receive(id){const o=S.orders.find(x=>x.id===id&&x.user===me);if(!o||o.status!=="shipped")return{err:"state"};const p=pool(o.pool);o.status="done";prod(p.prod).deals++;checkDone(p);save();return{}},
  async rate(id,n,body){const o=S.orders.find(x=>x.id===id&&x.user===me);if(!o||o.status!=="done"||o.rev)return{err:"state"};o.rev=n;prod(pool(o.pool).prod).rev.unshift([user().name,body,n]);save();return{}},
  async ship(id){const p=pool(id);if(!p||!mine(p)||p.status!=="full")return{err:"state"};p.status="shipped";poolOrders(p).forEach(o=>o.status="shipped");checkDone(p);save();return{}},
  async cancelPool(id){const p=pool(id);if(!p||!mine(p)||p.status!=="open")return{err:"state"};p.status="cancelled";poolOrders(p).forEach(o=>o.status="cancelled");save();return{}},
  async addPool(d){
    const u=user();if(!u||u.role!=="seller")return{err:"only_sellers"};
    const pr=prod(u.prod);
    if(!pr.cats.includes(d.cat))pr.cats.push(d.cat);
    if(!pr.goods.toLowerCase().includes(d.item.toLowerCase()))pr.goods=(pr.goods+" "+d.item.toLowerCase()).trim();
    S.pools.unshift({id:uid("g"),prod:pr.id,item:{ru:d.item,kz:d.item},cat:d.cat,unit:d.unit,target:d.target,got:0,extra:0,retail:d.retail,price:d.price,deadline:Date.now()+d.days*DAY,status:"open"});
    save();return{};
  }
};

// Облако: общая база Supabase. Все правила проверяет сама база (supabase/schema.sql)
const mail=ph=>ph+"@"+EMAIL_DOMAIN,pw=pin=>"sm-pin-"+pin; // Supabase требует пароль от 6 знаков
const errCode=e=>{console.warn("Supabase:",e);const m=(e&&e.message)||String(e||"");const c=m.match(/SM:(\w+)/);if(c)return c[1];return/fetch|network|timeout|Failed/i.test(m)?"err_net":"err_generic"};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error("timeout")),ms))]);
const loadScript=src=>new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=()=>no(new Error("network"));document.head.appendChild(el)});
const CloudAPI={
  async init(){
    await withTimeout(loadScript(SUPABASE_JS),10000);
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const {data}=await withTimeout(sb.auth.getSession(),10000);
    me=data.session?data.session.user.id:null;
    await withTimeout(this.refresh(),15000);
    if(me&&!user()){await sb.auth.signOut();me=null}
    sb.channel("sm-live").on("postgres_changes",{event:"*",schema:"public"},liveUpdate).subscribe();
  },
  tick(){}, // сроки сборов проверяет база (expire_pools)
  async refresh(){
    await sb.rpc("expire_pools");
    const none=Promise.resolve({data:[]});
    const q=await Promise.all([
      sb.from("producers").select("*").order("created_at"),
      sb.from("pools").select("*").order("created_at",{ascending:false}),
      sb.from("reviews").select("*").order("created_at",{ascending:false}),
      me?sb.from("profiles").select("id,role,name,phone"):none,
      me?sb.from("orders").select("*").order("created_at",{ascending:false}):none]);
    const bad=q.find(r=>r.error);if(bad)throw bad.error;
    const [pr,po,rv,pf,od]=q.map(r=>r.data||[]);
    S={v:3,
      prods:pr.map(p=>({id:p.id,name:p.name,type:p.type,dist:p.dist,cats:p.cats||[],goods:p.goods||"",desc:p.descr||{ru:"",kz:""},deals:p.deals,owner:p.owner,demoPhone:p.demo_phone,
        rev:rv.filter(r=>r.producer===p.id).map(r=>[r.author,r.body,r.stars])})),
      pools:po.map(p=>({id:p.id,prod:p.producer,item:p.item,cat:p.cat,unit:p.unit,target:p.target,got:p.got,extra:p.extra,members:p.members,retail:p.retail,price:p.price,deadline:Date.parse(p.deadline),status:p.status})),
      users:pf.map(u=>({...u,prod:(pr.find(x=>x.owner===u.id)||{}).id})),
      orders:od.map(o=>({id:o.id,pool:o.pool,user:o.shop,qty:o.qty,total:+o.total,saved:o.saved==null?null:+o.saved,status:o.status,rev:o.rating||0}))};
  },
  async call(fn,args){
    try{const {data,error}=await sb.rpc(fn,args);if(error)return{err:errCode(error)};await this.refresh();return{data}}
    catch(e){return{err:errCode(e)}}
  },
  async login(ph,pin){
    try{
      const {data,error}=await sb.auth.signInWithPassword({email:mail(ph),password:pw(pin)});
      if(error)return{err:/invalid/i.test(error.message)?"err_login":errCode(error)};
      me=data.user.id;await this.refresh();
      if(!user()){await sb.auth.signOut();me=null;return{err:"err_noprofile"}}
      return{user:user()};
    }catch(e){return{err:errCode(e)}}
  },
  async register(d){
    try{
      let {data,error}=await sb.auth.signUp({email:mail(d.phone),password:pw(d.pin)});
      if(error&&/registered|exists/i.test(error.message)){
        // номер уже есть: возможно, прошлая регистрация оборвалась до создания профиля
        const r=await sb.auth.signInWithPassword({email:mail(d.phone),password:pw(d.pin)});
        if(r.error)return{err:"err_phone_used"};
        const {data:pf}=await sb.from("profiles").select("id").eq("id",r.data.user.id).maybeSingle();
        if(pf){await sb.auth.signOut();return{err:"err_phone_used"}}
        data=r.data;
      }else if(error)return{err:errCode(error)};
      if(!data.session)return{err:"err_confirm"};
      me=data.user.id;
      const {error:e2}=await sb.rpc("register_profile",{p_role:d.role,p_name:d.name,p_phone:d.phone,p_type:d.type,p_dist:d.dist});
      if(e2)return{err:errCode(e2)};
      await this.refresh();return{user:user()};
    }catch(e){return{err:errCode(e)}}
  },
  async logout(){try{await sb.auth.signOut()}catch(e){}me=null;try{await this.refresh()}catch(e){}},
  join(id,q){return this.call("join_pool",{p_pool:id,p_qty:q})},
  cancelOrder(id){return this.call("cancel_order",{p_order:id})},
  receive(id){return this.call("receive_order",{p_order:id})},
  rate(id,n,body){return this.call("rate_order",{p_order:id,p_stars:n,p_body:body})},
  ship(id){return this.call("ship_pool",{p_pool:id})},
  cancelPool(id){return this.call("cancel_pool",{p_pool:id})},
  addPool(d){return this.call("add_pool",{p_item:d.item,p_cat:d.cat,p_unit:d.unit,p_target:d.target,p_price:d.price,p_retail:d.retail,p_days:d.days})}
};

async function withBusy(btn,fn){
  if(btn){btn.disabled=true;btn.dataset.l=btn.textContent;btn.textContent=t("busy")}
  try{return await fn()}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn.dataset.l}}
}

// умный подбор: разбор запроса и баллы по правилам
function smart(q){
  const w=q.toLowerCase().split(/[^a-zа-яёәғқңөұүһі0-9]+/).filter(Boolean);
  const cats=Object.keys(KW).filter(c=>KW[c].some(s=>w.some(x=>x.startsWith(s))));
  const am=q.match(/(\d[\d\s]*)\s*(кг|л|kg)/i),need=am?+am[1].replace(/\s/g,""):null;
  return S.pools.filter(p=>p.status==="open"&&!mine(p)).map(p=>{
    const pr=prod(p.prod),d=dist(pr.dist);let s=0;const why=[];
    const iw=(p.item.ru+" "+p.item.kz+" "+pr.goods).toLowerCase().split(/[^a-zа-яёәғқңөұүһі]+/).filter(x=>x.length>2);
    const hit=w.some(x=>x.length>2&&iw.some(y=>y.startsWith(x.slice(0,4))||x.startsWith(y.slice(0,4))));
    const catHit=cats.includes(p.cat);
    if(!catHit&&!hit)return null;
    if(hit){s+=35;why.push(t("why_item"))}
    if(catHit){s+=30;why.push(t("why_cat"))}
    const fill=p.got/p.target;s+=fill*15;if(fill>=.6)why.push(t("why_fill"));
    const r=rating(pr);s+=r/5*10;if(r>=4.7)why.push(t("why_rate"));
    if(d.km<=50){s+=5;why.push(t("why_near"))}
    if(need!=null){if(p.target-p.got>=need){s+=5;why.push(t("why_vol"))}else s-=10}
    if(p.retail){s+=savePct(p)/5;why.push(tf("why_save",savePct(p)))}
    return{p,pct:Math.max(1,Math.min(99,Math.round(s))),why:why.slice(0,4)};
  }).filter(Boolean).sort((a,b)=>b.pct-a.pct).slice(0,3);
}

    <button class="btn big wide" type="submit">${t("do_reg")}</button>
    <p>${t("have")} <a href="#login" style="font-weight:700;color:var(--brand)">${t("login_btn")}</a></p>
  </form></div>`;
  $$(".role").forEach(b=>b.onclick=()=>{regRole=b.dataset.r;render()});
  $("#rf").onsubmit=async e=>{
    e.preventDefault();
    const name=$("#rn").value.trim(),ph=normPhone($("#rp").value),pin=$("#rpin").value.trim(),pin2=$("#rpin2").value.trim();
    if(name.length<2)return showErr("rErr",t("err_name"),"rn");
    if(!ph)return showErr("rErr",t("err_phone"),"rp");
    if(!/^\d{4}$/.test(pin))return showErr("rErr",t("err_pin"),"rpin");
    if(pin!==pin2)return showErr("rErr",t("err_pin2"),"rpin2");
    const r=await withBusy(e.submitter,()=>API.register({role:regRole,name,phone:ph,pin,type:sel?$("#rt").value:null,dist:sel?$("#rd").value:null}));
    if(r.err)return showErr("rErr",errText(r.err),r.err==="err_phone_used"?"rp":null);
    afterAuth(r.user,true);
  };
};

function afterAuth(u,isNew){
  const p=pending;pending=null;
  if(p&&p.join&&u.role==="shop"){goTo("#pools");setTimeout(()=>joinDlg(p.join),0);return}
  if(p&&p.route){goTo("#"+p.route);return}
  if(isNew){
    goTo(u.role==="seller"?"#add":"#pools");
    setTimeout(()=>okDlg(t("ok_reg_t"),u.role==="seller"?t("ok_reg_seller"):t("ok_reg_shop")),0);
    return;
  }
  goTo("#cab");
}
async function logout(){await API.logout();pending=null;goTo("#home")}

/* ===== Кабинет ===== */
const stepper=s=>{const i={wait:0,ready:1,shipped:2,done:3}[s];return `<div class="stp">${[0,1,2,3].map(k=>`<span class="${k<=i?"on":""}">${k<=i?"✓ ":""}${t("st"+k)}</span>`).join("")}</div>`};

VIEWS.cab=()=>{
  const u=user();
  if(!u){pending={route:"cab"};return VIEWS.login()}
  const head=`<div class="head row"><div><h1>${tf("hi",esc(u.name))}</h1><p class="lead">${u.role==="shop"?t("cab_shop_d"):t("cab_seller_d")}</p><p class="meta" style="margin-top:6px">${u.role==="shop"?t("acc_shop"):t("acc_seller")} · ${fmtPhone(u.phone)}</p></div>
    <button class="btn ghost" type="button" data-logout>${t("logout")}</button></div>`;
  const foot=MODE==="local"?`<button class="btn sm ghost" type="button" id="rs" style="margin-top:24px">${t("reset")}</button>`:"";
  u.role==="shop"?shopCab(u,head,foot):sellerCab(u,head,foot);
  const rs=$("#rs");if(rs)rs.onclick=()=>{if(confirm(t("reset_q"))){S=fresh();save();logout()}};
};

function shopCab(u,head,foot){
  const os=S.orders.filter(o=>o.user===u.id),act=os.filter(live);
  const spent=act.reduce((s,o)=>s+o.total,0),saved=act.reduce((s,o)=>s+Math.max(0,o.saved||0),0);
  $("#app").innerHTML=`${head}
  <div class="kpis" style="margin:0 0 24px">
    <div><b>${act.length}</b><span>${t("cab_orders")}</span></div>
    <div><b>${money(spent)}</b><span>${t("cab_spent")}</span></div>
    <div><b style="color:var(--brand)">${money(saved)}</b><span>${t("cab_saved")}</span></div>
  </div>
  <div id="ol">${os.length?os.map(o=>{
    const p=pool(o.pool),pr=prod(p.prod),ow=prodUser(pr);
    return `<div class="card ${o.status}">
      <div class="row"><h3>${CAT[p.cat].i} ${esc(N(p.item))} — ${num(o.qty)} ${p.unit}</h3><b class="num">${money(o.total)}</b></div>
      <div class="meta">${t("seller")}: ${esc(pr.name)}${ow&&o.status!=="cancelled"?` · ${fmtPhone(ow.phone)}`:""}${o.saved?` · ${t("sum_saved").toLowerCase()} <b style="color:var(--brand)">${money(Math.max(0,o.saved))}</b>`:""}</div>
      <p style="margin-top:8px"><span class="badge ${o.status}">${t("ost_"+o.status)}</span>${o.status==="wait"?` <span class="meta">· ${tf("left_to",num(p.target-p.got)+" "+p.unit)} · ${daysLeft(p)}</span>`:""}</p>
      ${o.status==="cancelled"?"":stepper(o.status)}
      ${o.status==="wait"?`<div class="acts"><a class="btn sm" href="#pools" data-addmore="${p.id}">${t("add_more")}</a><button class="btn sm red" type="button" data-cancel="${o.id}">${t("o_cancel")}</button></div>`:""}
      ${o.status==="shipped"?`<div class="acts"><button class="btn" type="button" data-recv="${o.id}">${t("o_receive")}</button></div>`:""}
      ${o.status==="done"?(o.rev?`<p style="margin-top:8px">${t("rated")} <span class="stars">${"★".repeat(o.rev)}</span></p>`
        :`<div class="rate"><b style="margin-right:8px">${t("rate")}</b>${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${o.id}" data-n="${n}" aria-label="${n} / 5">★</button>`).join("")}</div>`):""}
    </div>`}).join(""):`<div class="empty">${t("cab_empty")}<br><a class="btn" style="margin-top:16px" href="#pools">${t("go_pools")}</a></div>`}</div>${foot}`;
  $("#ol").onclick=e=>{
    const find=a=>S.orders.find(x=>x.id===e.target.closest("["+a+"]").getAttribute(a));
    if(e.target.closest("[data-addmore]")){e.preventDefault();const id=e.target.closest("[data-addmore]").dataset.addmore;goTo("#pools");setTimeout(()=>joinDlg(id),0);return}
    if(e.target.closest("[data-cancel]")){const o=find("data-cancel");
      if(o.status!=="wait"||!confirm(t("o_cancel_q")))return;
      return doAction(API.cancelOrder(o.id),t("t_cancelled"))}
    if(e.target.closest("[data-recv]")){const o=find("data-recv");if(o.status!=="shipped")return;return doAction(API.receive(o.id))}
    if(e.target.closest("[data-rate]")){const b=e.target.closest("[data-rate]"),o=find("data-rate"),n=+b.dataset.n;
      if(o.status!=="done"||o.rev)return;
      return doAction(API.rate(o.id,n,L[lang][n>=4?"rev_good":n===3?"rev_mid":"rev_bad"]),t("t_thanks"))}
  };
}

function sellerCab(u,head,foot){
  const pr=prod(u.prod),ps=S.pools.filter(p=>p.prod===pr.id);
  const ordersN=ps.reduce((s,p)=>s+poolOrders(p).length,0);
  $("#app").innerHTML=`${head}
  <div class="kpis" style="margin:0 0 24px">
    <div><b>${ps.filter(p=>p.status==="open").length}</b><span>${t("k_active")}</span></div>
    <div><b>${ordersN}</b><span>${t("k_orders")}</span></div>
    <div><b>${rating(pr)?"★ "+rating(pr).toFixed(1):"—"}</b><span>${t("k_rating")}</span></div>
  </div>
  <div class="row" style="margin-bottom:16px"><h2 style="margin:0">${t("my_pools")}</h2><a class="btn" href="#add">${t("add_new")}</a></div>
  <div id="sl">${ps.length?ps.map(p=>{
    const os=poolOrders(p),pct=Math.min(100,Math.round(p.got/p.target*100)),got=os.filter(o=>o.status==="done").length;
    return `<div class="card ${p.status}">
      <div class="row"><h3>${CAT[p.cat].i} ${esc(N(p.item))} · ${money(p.price)} ${t("per")} ${p.unit}</h3><span class="badge ${p.status}">${t("pst_"+p.status)}</span></div>
      <div class="prog" style="margin-top:12px" role="progressbar" aria-label="${pct}%" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="transform:scaleX(${pct/100})"></i></div>
      <div class="row meta" style="margin-top:6px"><span>${num(p.got)} / ${num(p.target)} ${p.unit} (${pct}%)</span>${p.status==="open"?`<span>⏳ ${daysLeft(p)}</span>`:""}</div>
      <h3 style="margin-top:14px;font-size:18px">${t("buyers")}</h3>
      <ul class="buyers">${os.map(o=>{const b=S.users.find(x=>x.id===o.user);return `<li><span>🏪 ${esc(b?b.name:"—")}${b?` · ${fmtPhone(b.phone)}`:""}</span><b>${num(o.qty)} ${p.unit} <span class="badge ${o.status}">${t("st"+{wait:0,ready:1,shipped:2,done:3}[o.status])}</span></b></li>`}).join("")}
        ${p.extra?`<li class="meta">${tf("demo_buyers",p.extra)}</li>`:""}${!os.length&&!p.extra?`<li class="meta">${t("no_buyers")}</li>`:""}</ul>
      ${p.status==="shipped"?`<p class="note">${tf("p_received",{a:got,b:os.length})}</p>`:""}
      <div class="acts">
        ${p.status==="full"?`<button class="btn" type="button" data-ship="${p.id}">${t("p_ship")}</button>`:""}
        ${p.status==="open"?`<button class="btn sm red" type="button" data-pcancel="${p.id}">${t("p_cancel")}</button>`:""}
      </div>
    </div>`}).join(""):`<div class="empty">${t("seller_empty")}<br><a class="btn" style="margin-top:16px" href="#add">${t("add_new")}</a></div>`}</div>
  ${pr.rev.length?`<h2 style="margin-top:32px">${t("reviews")}</h2>${pr.rev.map(r=>`<div class="rev"><b>${esc(r[0])}</b> <span class="stars">${"★".repeat(r[2])}</span><br>${esc(r[1])}</div>`).join("")}`:""}
  ${foot}`;
  $("#sl").onclick=e=>{
    const s=e.target.closest("[data-ship]"),c=e.target.closest("[data-pcancel]");
    if(s){const p=pool(s.dataset.ship);if(p.status!=="full")return;
      doAction(API.ship(p.id)).then(r=>{if(!r.err)okDlg(t("ok_ship_t"),t("ok_ship_d"))})}
    if(c){const p=pool(c.dataset.pcancel);if(p.status!=="open"||!confirm(t("p_cancel_q")))return;
      doAction(API.cancelPool(p.id),t("t_cancelled"))}
  };
}

/* ===== Шапка, меню, подвал, язык ===== */
function closeMenu(){$("#menu").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false")}
function render(){
  API.tick();
  $("#banner").innerHTML=offline?`<div class="banner" role="status">${t("offline_banner")}</div>`:"";
  const u=user();
  document.documentElement.lang=lang==="kz"?"kk":"ru";
  $("#lang").textContent=t("lang_btn");
  $("#helpBtn").textContent=t("help_btn");
  $("#menuBtn").textContent=t("menu");
  $("#fab b").textContent=t("fab");
  $("#fab").setAttribute("aria-label",t("help_t"));
  const acc=$("#accBtn");
  acc.textContent=u?"👤 "+u.name:t("login_btn");acc.href=u?"#cab":"#login";acc.classList.toggle("in",!!u);
  const cur=k=>route===k||(k==="cab"&&(route==="login"||route==="reg"));
  $("#nav").innerHTML=NAV.map(([k])=>`<a href="#${k}" class="${cur(k)?"on":""}"${cur(k)?' aria-current="page"':""}>${t("nav_"+k)}</a>`).join("");
  $("#menu").innerHTML=`<div class="mtop"><b style="font-size:24px">${t("menu_t")}</b><button class="hbtn" type="button" id="menuX">${t("close")}</button></div>
    ${NAV.map(([k,ic])=>`<a href="#${k}" class="mi ${cur(k)?"on":""}"><i aria-hidden="true">${ic}</i>${t("nav_"+k)}</a>`).join("")}
    ${u?`<button class="btn ghost wide" type="button" data-logout style="margin-top:6px">${t("logout")} (${esc(u.name)})</button>`:`<a class="btn big wide" href="#login" style="margin-top:6px">${t("login_btn")}</a>`}
    <button class="btn big orange wide" type="button" data-help style="margin-top:10px">${t("help_btn")}</button>
    <button class="btn ghost wide" type="button" id="lang2" style="margin-top:10px">${t("lang_full")}</button>`;
  $("#menuX").onclick=closeMenu;
  $("#lang2").onclick=switchLang;
  $("#foot").innerHTML=`<div class="fgrid4">
    <div><b style="font-size:20px">Supply<span style="color:var(--brand)">Match</span></b><p>${t("foot_d")}</p><p style="margin-top:12px">${t("foot_team")}</p></div>
    <div><b>${t("foot_sec")}</b>${NAV.map(([k])=>`<a href="#${k}">${t("nav_"+k)}</a>`).join("")}</div>
    <div><b>${t("foot_help")}</b><button class="link" type="button" data-help style="padding:4px 0">${t("help_btn")}</button><a href="#home" data-faq>${t("faq_t")}</a><p style="margin-top:12px">${t(MODE==="cloud"?"foot_cloud":"foot_demo")}</p></div>
  </div>`;
  VIEWS[route]();
}
function switchLang(){lang=lang==="ru"?"kz":"ru";store.set("sm_lang",lang);closeMenu();render()}
function go(){
  const r=location.hash.slice(1);
  route=VIEWS[r]?r:"home";
  if(route==="login"||route==="reg"){if(user()){location.replace("#cab");return}}
  else pending=null; // ушли в другой раздел — забываем, куда хотели вернуться
  closeMenu();if(dlg.open)dlg.close();render();window.scrollTo(0,0);
}
$("#lang").onclick=switchLang;
$("#menuBtn").onclick=()=>{$("#menu").classList.add("open");$("#menuBtn").setAttribute("aria-expanded","true");$("#menuX").focus()};
document.addEventListener("click",e=>{
  const el=s=>e.target.closest(s);
  if(el("[data-join]"))return joinClick(el("[data-join]").dataset.join);
  if(el("[data-prod]"))return prodDlg(el("[data-prod]").dataset.prod);
  if(el("[data-help]")){closeMenu();return helpDlg()}
  if(el("[data-demo]"))return toast(t("t_demo"));
  if(el("[data-logout]")){closeMenu();if(dlg.open)dlg.close();return logout()}
  if(el("[data-role]"))regRole=el("[data-role]").dataset.role;
  if(el("[data-pend]"))pending={route:el("[data-pend]").dataset.pend};
  if(el("[data-faq]")){e.preventDefault();goTo("#home");setTimeout(()=>{const f=$(".faq");if(f)f.scrollIntoView()},0);return}
  if(el("[data-close]"))dlg.close();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
// данные меняются в другой вкладке — перерисовываем
addEventListener("storage",e=>{if(MODE!=="local")return;if(e.key==="sm_state3"||e.key==="sm_me"){S=store.get("sm_state3")||fresh();me=store.get("sm_me");render()}});
async function boot(){
  $("#app").innerHTML=`<p class="meta" style="padding:64px 0;text-align:center">${t("loading")}</p>`;
  const want=SUPABASE_URL&&SUPABASE_KEY&&!/[?&]offline\b/.test(location.search);
  if(want){
    MODE="cloud";API=CloudAPI;
    try{await CloudAPI.init()}catch(e){console.warn("Supabase недоступен — включаю оффлайн-демо",e);MODE="local";offline=true}
  }
  if(MODE==="local"){API=LocalAPI;await LocalAPI.init()}
  addEventListener("hashchange",go);
  go();
}
boot();
</script>
</body>
