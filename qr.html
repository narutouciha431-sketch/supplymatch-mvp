<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>SupplyMatch — QR-код</title>
<style>
:root{--ink:#111a13;--mute:#3f4a42;--brand:#17692f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:var(--ink);font:20px/1.5 system-ui,sans-serif;padding:16px;text-align:center}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 8px}
h1 span{color:var(--brand)}
p{color:var(--mute);margin:0 0 24px}
#qr{display:inline-block;padding:16px;border:3px solid var(--brand);border-radius:24px;background:#fff}
#qr img,#qr canvas{display:block;width:min(320px,70vw)!important;height:auto!important}
a{color:var(--brand);font-weight:700;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1 translate="no">Supply<span>Match</span></h1>
  <p>Наведите камеру телефона на код</p>
  <div id="qr" role="img" aria-label="QR-код со ссылкой на сайт"></div>
  <p style="margin-top:20px"><a id="link"></a></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ссылка на главную страницу сайта рядом с этим файлом
const url=new URL("./",location.href).href;
const a=document.getElementById("link");a.href=url;a.textContent=url;
new QRCode(document.getElementById("qr"),{text:url,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
</script>
</body>
</html>
